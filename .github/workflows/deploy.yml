name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (client)
        env:
          # Set the Vite base to the repo name so assets are served correctly on GitHub Pages
          VITE_BASE: "/${{ github.event.repository.name }}/"
          # Backend API base (set this secret in repository secrets as VITE_API_BASE)
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - name: Ensure SPA fallback (404 -> index)
        run: |
          if [ -f dist/public/index.html ]; then
            cp dist/public/index.html dist/public/404.html || true
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          publish_branch: gh-pages

