version: '3.8'

services:
  backend:
    build:
      context: .
      target: server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: client
    ports:
      - "5001:80"
    depends_on:
      - backend
    restart: unless-stopped

